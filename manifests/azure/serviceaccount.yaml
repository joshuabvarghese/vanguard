# Federates the existing vanguard-operator ServiceAccount (defined in
# manifests/rbac/operator.yaml) to the Azure user-assigned managed identity
# provisioned in infra/bicep/main.bicep, by adding the two annotations/
# labels Workload Identity needs — deliberately not a new/competing
# ServiceAccount, since RBAC permissions and Azure identity are two
# different concerns attached to the *same* pod identity.
#
# Apply manifests/rbac/operator.yaml first, then this (`kubectl apply -f`
# both — same object name, this just adds fields via strategic merge).
# AKS's Workload Identity webhook then projects a short-lived, auto-rotated
# token for any pod using this ServiceAccount, which
# azure_identity::DefaultAzureCredential (used by
# src/cloud/azure/keyvault.rs and monitor.rs) picks up automatically via
# AZURE_CLIENT_ID / AZURE_FEDERATED_TOKEN_FILE env vars the webhook
# injects — no application code needs to know the token file path.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vanguard-operator
  namespace: vanguard-system
  labels:
    app.kubernetes.io/managed-by: vanguard-operator
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: "<WORKLOAD_IDENTITY_CLIENT_ID>"
