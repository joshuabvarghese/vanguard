# Template: mounts a tenant's proxy TLS material straight from Key Vault
# into that tenant's proxy pod, via the AKS-managed Secrets Store CSI
# driver — NOT through Vanguard's own process. This is the deliberate
# architectural split documented in src/cloud/azure/keyvault.rs: the
# control plane's `SecretsProvider` trait is for secrets the vanguard
# *process* needs (bootstrap token, HMAC key); tenant workload secrets are
# a Kubernetes-native concern, synced by the CSI driver so tenant secret
# material never passes through the control plane's memory or logs.
#
# In production this file is templated per tenant by the operator
# (reconcile.rs would gain an `ensure_secret_provider_class()` alongside
# its existing `ensure_namespace()`/`ensure_configmap()`/
# `ensure_proxy_deployment()` — not implemented here to keep this PR's
# blast radius to the Azure integration layer, not a CRD/reconciler change).
# One instance is shown for tenant `acme-corp` as a concrete example.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: kv-acme-corp
  namespace: tenant-acme-corp
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "<WORKLOAD_IDENTITY_CLIENT_ID>"
    keyvaultName: "" # set to the Key Vault name (not URI) from `main.bicep` output
    tenantId: "<TENANT_ID>"
    objects: |
      array:
        - |
          objectName: acme-corp-proxy-tls-cert
          objectType: secret
        - |
          objectName: acme-corp-proxy-tls-key
          objectType: secret
  secretObjects:
    - secretName: proxy-acme-corp-tls
      type: kubernetes.io/tls
      data:
        - objectName: acme-corp-proxy-tls-cert
          key: tls.crt
        - objectName: acme-corp-proxy-tls-key
          key: tls.key
